<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Destination B1 – Bài tập online</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#5d6678;--line:#dfe3ec;--accent:#2b6cb0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--text:#e8ebf2;--muted:#9aa4b8;--line:#2e3545;--accent:#6aa7e8}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--text:#e8ebf2;--muted:#9aa4b8;--line:#2e3545;--accent:#6aa7e8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
input{width:100%;box-sizing:border-box;padding:10px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);margin-bottom:14px}
a.card{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
a.card:hover,a.card:focus-visible{border-color:var(--accent)}
.badge{flex:none;min-width:64px;text-align:center;background:var(--accent);color:#fff;border-radius:8px;padding:6px 8px;font-weight:700;font-size:.9rem}
.t{font-weight:600}
.d{color:var(--muted);font-size:.92rem}
.go{margin-left:auto;color:var(--accent);font-weight:600;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:20px}
</style>
</head>
<body>
<main>
<h1>Destination B1 – Bài tập online</h1>
<p class="sub">Chọn bài để làm. Bài được chấm điểm tự động ngay sau khi nộp.</p>
<input type="text" id="s" placeholder="Tìm bài (ví dụ: Unit 7, future)…" autocomplete="off">
<div id="list"></div>
</main>
<script>
/* ===== GIÁO VIÊN CHỈNH Ở ĐÂY =====
 Mỗi bài là một dòng. Thêm bài mới: copy một dòng, sửa lại, nhớ có dấu phẩy cuối dòng.
 badge: nhãn bên trái (vd "Buổi 9") | file: tên file đã tải lên GitHub | title: tên bài | desc: mô tả ngắn
*/
const LESSONS = [
  {badge:"Buổi 2", file:"buoi2.html", title:"Unit 2 – Past simple, Past continuous, Used to", desc:"Kể chuyện quá khứ (tr. 9–11)"},
  {badge:"Buổi 3", file:"buoi3.html", title:"Unit 3 – Fun and games", desc:"Từ vựng, phrasal verbs, word formation (tr. 12–14)"},
  {badge:"Buổi 4", file:"buoi4.html", title:"Review 1 – Units 1, 2, 3", desc:"Ôn tập các thì và từ vựng Unit 3 (tr. 16–17)"},
  {badge:"Buổi 5", file:"buoi5.html", title:"Unit 4 – Present perfect simple & continuous", desc:"Trải nghiệm và thành tựu (tr. 18–20)"},
  {badge:"Buổi 6", file:"buoi6.html", title:"Unit 5 – Past perfect simple & continuous", desc:"Kể chuyện quá khứ nâng cao (tr. 21–23)"},
  {badge:"Buổi 7", file:"buoi7.html", title:"Unit 6 – Learning and doing", desc:"Từ vựng, phrasal verbs, word formation (tr. 24)"},
  {badge:"Buổi 8", file:"buoi8.html", title:"Review 2 – Units 4, 5, 6", desc:"Ôn tập các thì hoàn thành và từ vựng Unit 6 (tr. 28–29)"},
  {badge:"Buổi 9", file:"buoi9.html", title:"Unit 7 – Future time", desc:"Present continuous, will, be going to, present simple (tr. 30–32)"},
  {badge:"Buổi 10", file:"buoi10.html", title:"Unit 8 – Prepositions of time and place", desc:"in, on, at (tr. 33–35)"},
  {badge:"Buổi 11", file:"buoi11.html", title:"Unit 9 – Coming and going", desc:"Từ vựng, phrasal verbs, word formation (tr. 36)"},
  {badge:"Buổi 12", file:"buoi12.html", title:"Review 3 – Units 7, 8, 9", desc:"Ôn tập tương lai, in/on/at và từ vựng Unit 9 (tr. 40–41)"},
  {badge:"Buổi 13", file:"buoi13.html", title:"Unit 10 – The passive 1", desc:"Câu bị động: present simple, past simple, will (tr. 42–44)"},
  {badge:"Buổi 14", file:"buoi14.html", title:"Unit 11 – The passive 2", desc:"Bị động nâng cao: continuous, perfect, be going to, modals (tr. 45–47)"},
  {badge:"Buổi 15", file:"buoi15.html", title:"Unit 12 – Friends and relations", desc:"Từ vựng, phrasal verbs, word formation (tr. 48)"},
  {badge:"Buổi 16", file:"buoi16.html", title:"Review 4 – Units 10, 11, 12", desc:"Ôn tập câu bị động và từ vựng Unit 12 (tr. 52–53)"},
  {badge:"Buổi 17", file:"buoi17.html", title:"Unit 13 – Countable and uncountable nouns", desc:"Danh từ đếm được/không đếm được, much/many, a few/a little (tr. 54–56)"},
  {badge:"Buổi 18", file:"buoi18.html", title:"Unit 14 – Articles", desc:"Mạo từ a/an, the và không dùng mạo từ (tr. 57–59)"},
  {badge:"Buổi 19", file:"buoi19.html", title:"Unit 15 – Buying and selling", desc:"Từ vựng, phrasal verbs, word formation (tr. 60)"},
  {badge:"Buổi 20", file:"buoi20.html", title:"Review 5 – Units 13, 14, 15", desc:"Ôn tập danh từ, mạo từ và từ vựng Unit 15 (tr. 64–65)"},
  {badge:"Buổi 33", file:"buoi33.html", title:"Unit 24 – People and daily life", desc:"Từ vựng, phrasal verbs, word formation (tr. 100)"},
];
/* ===== HẾT PHẦN CHỈNH ===== */

const list=document.getElementById("list"),box=document.getElementById("s");
function render(){
  const k=box.value.trim().toLowerCase();
  list.innerHTML="";
  const rows=LESSONS.filter(x=>(x.badge+" "+x.title+" "+x.desc).toLowerCase().includes(k));
  if(!rows.length){const e=document.createElement("div");e.className="empty";e.textContent="Không tìm thấy bài nào.";list.appendChild(e);return;}
  rows.forEach(x=>{
    const a=document.createElement("a");a.className="card";a.href=x.file;
    const b=document.createElement("div");b.className="badge";b.textContent=x.badge;
    const m=document.createElement("div");
    const t=document.createElement("div");t.className="t";t.textContent=x.title;
    const d=document.createElement("div");d.className="d";d.textContent=x.desc;
    m.append(t,d);
    const g=document.createElement("div");g.className="go";g.textContent="Làm bài →";
    a.append(b,m,g);list.appendChild(a);
  });
}
box.addEventListener("input",render);
render();
</script>
</body>
</html>
