<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English B1 – Bài tập tự chấm</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#5d6678;--line:#dfe3ec;--accent:#2b6cb0;--ok:#1f8a4c;--okbg:#e4f5ea;--bad:#c0392b;--badbg:#fbe9e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--text:#e8ebf2;--muted:#9aa4b8;--line:#2e3545;--accent:#6aa7e8;--ok:#5fd18a;--okbg:#17321f;--bad:#ff8a7a;--badbg:#3a1d1a}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--text:#e8ebf2;--muted:#9aa4b8;--line:#2e3545;--accent:#6aa7e8;--ok:#5fd18a;--okbg:#17321f;--bad:#ff8a7a;--badbg:#3a1d1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.4rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.q{font-weight:600;margin:0 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.opt input{margin-top:4px}
input[type=text]{width:100%;box-sizing:border-box;padding:10px;font-size:1rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
button{font-size:1rem;padding:10px 18px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.right{border-color:var(--ok)!important;background:var(--okbg)}
.wrong{border-color:var(--bad)!important;background:var(--badbg)}
.fb{margin-top:8px;font-size:.92rem;color:var(--muted)}
.score{font-size:1.6rem;font-weight:700}
textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 14px}
.bar div{height:100%;background:var(--accent);width:0}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<p class="sub" id="sub"></p>
<div class="card" id="nameBox"><label for="name"><b>Họ và tên</b></label><input type="text" id="name" placeholder="Nguyễn Văn A" autocomplete="name"></div>
<div class="bar"><div id="prog"></div></div>
<div id="quiz"></div>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<button id="submit">Nộp bài &amp; chấm điểm</button>
<button class="sec" id="reset" style="display:none">Làm lại</button>
</div>
<div class="card" id="result" style="display:none;margin-top:16px">
<div class="score" id="scoreTxt"></div>
<p class="sub">Gửi kết quả bên dưới cho giáo viên (chụp màn hình hoặc sao chép).</p>
<textarea id="summary" rows="4" readonly></textarea>
</div>
</main>
<script>
/* ===== GIÁO VIÊN CHỈNH Ở ĐÂY =====
 type "mc": q, options[], answer (số thứ tự bắt đầu từ 0), why (giải thích, tuỳ chọn)
 type "gap": q (dùng ___ cho chỗ trống), answers[] (các đáp án chấp nhận), why
*/
const QUIZ = {
  title: "English B1 – Practice Quiz",
  sub: "Chọn đáp án đúng hoặc điền từ vào chỗ trống. Bấm “Nộp bài” để xem điểm.",
  items: [
    {type:"mc", q:"If I ___ more time, I would learn another language.", options:["have","had","will have","would have"], answer:1, why:"Câu điều kiện loại 2: If + quá khứ đơn, would + V."},
    {type:"mc", q:"She has lived in this city ___ 2019.", options:["for","since","during","from"], answer:1, why:"Dùng since + mốc thời gian."},
    {type:"mc", q:"I’m not used to ___ up so early.", options:["get","got","getting","be getting"], answer:2, why:"be used to + V-ing."},
    {type:"mc", q:"The report ___ by the manager yesterday.", options:["wrote","was written","has written","is writing"], answer:1, why:"Bị động quá khứ đơn: was/were + V3."},
    {type:"mc", q:"He asked me where ___.", options:["do I live","did I live","I lived","I live"], answer:2, why:"Câu gián tiếp: trật tự câu khẳng định, lùi thì."},
    {type:"gap", q:"You ___ (not / have to) wear a uniform; it’s optional.", answers:["don't have to","do not have to"], why:"Không bắt buộc: don’t have to."},
    {type:"gap", q:"We’ve been waiting ___ two hours.", answers:["for"], why:"for + khoảng thời gian."},
    {type:"gap", q:"I’m interested ___ learning to cook.", answers:["in"], why:"be interested in."},
    {type:"gap", q:"If it rains tomorrow, we ___ (stay) at home.", answers:["will stay","'ll stay"], why:"Điều kiện loại 1: If + hiện tại, will + V."},
    {type:"gap", q:"This is the man ___ helped me yesterday.", answers:["who","that"], why:"Đại từ quan hệ chỉ người làm chủ ngữ: who/that."}
  ]
};
/* ===== HẾT PHẦN CHỈNH ===== */

const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g," ").trim();
const $=id=>document.getElementById(id);
const quiz=$("quiz");
$("title").textContent=QUIZ.title;$("sub").textContent=QUIZ.sub;document.title=QUIZ.title;

function build(){
  quiz.innerHTML="";
  QUIZ.items.forEach((it,i)=>{
    const c=document.createElement("div");c.className="card";c.id="c"+i;
    const q=document.createElement("p");q.className="q";q.textContent=(i+1)+". "+it.q;c.appendChild(q);
    if(it.type==="mc"){
      it.options.forEach((o,j)=>{
        const l=document.createElement("label");l.className="opt";
        const r=document.createElement("input");r.type="radio";r.name="q"+i;r.value=j;r.onchange=progress;
        const s=document.createElement("span");s.textContent=o;
        l.append(r,s);c.appendChild(l);
      });
    }else{
      const t=document.createElement("input");t.type="text";t.id="g"+i;t.autocomplete="off";t.autocapitalize="off";t.spellcheck=false;t.oninput=progress;
      c.appendChild(t);
    }
    const fb=document.createElement("div");fb.className="fb";fb.id="f"+i;c.appendChild(fb);
    quiz.appendChild(c);
  });
  progress();
}
function answered(i){
  const it=QUIZ.items[i];
  if(it.type==="mc")return !!document.querySelector('input[name="q'+i+'"]:checked');
  return $("g"+i).value.trim()!=="";
}
function progress(){
  const n=QUIZ.items.filter((_,i)=>answered(i)).length;
  $("prog").style.width=(100*n/QUIZ.items.length)+"%";
}
function grade(){
  let score=0;
  QUIZ.items.forEach((it,i)=>{
    const c=$("c"+i),fb=$("f"+i);let ok=false,shown="";
    if(it.type==="mc"){
      const ch=document.querySelector('input[name="q'+i+'"]:checked');
      ok=!!ch&&+ch.value===it.answer;shown=it.options[it.answer];
      c.querySelectorAll(".opt").forEach((l,j)=>{
        l.classList.remove("right","wrong");
        if(j===it.answer)l.classList.add("right");
        else if(ch&&+ch.value===j)l.classList.add("wrong");
        l.querySelector("input").disabled=true;
      });
    }else{
      const t=$("g"+i);ok=it.answers.some(a=>norm(a)===norm(t.value));shown=it.answers[0];
      t.classList.remove("right","wrong");t.classList.add(ok?"right":"wrong");t.disabled=true;
    }
    if(ok)score++;
    fb.textContent=(ok?"✓ Đúng. ":"✗ Sai. Đáp án: "+shown+". ")+(it.why||"");
  });
  const total=QUIZ.items.length,name=$("name").value.trim()||"(chưa nhập tên)";
  $("scoreTxt").textContent="Điểm: "+score+"/"+total+" ("+Math.round(10*score/total*10)/10+"/10)";
  $("summary").value=name+" – "+QUIZ.title+"\nĐiểm: "+score+"/"+total+"\nNgày: "+new Date().toLocaleString("vi-VN");
  $("result").style.display="block";$("reset").style.display="inline-block";$("submit").style.display="none";
  $("result").scrollIntoView({behavior:"smooth"});
}
$("submit").onclick=()=>{
  const left=QUIZ.items.filter((_,i)=>!answered(i)).length;
  if(left&&!confirm("Còn "+left+" câu chưa làm. Vẫn nộp bài?"))return;
  grade();
};
$("reset").onclick=()=>{build();$("result").style.display="none";$("reset").style.display="none";$("submit").style.display="inline-block";window.scrollTo({top:0,behavior:"smooth"})};
build();
</script>
</body>
</html>
