<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buổi 7 – Unit 6: Learning and doing</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#5d6678;--line:#dfe3ec;--accent:#2b6cb0;--ok:#1f8a4c;--okbg:#e4f5ea;--bad:#c0392b;--badbg:#fbe9e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--text:#e8ebf2;--muted:#9aa4b8;--line:#2e3545;--accent:#6aa7e8;--ok:#5fd18a;--okbg:#17321f;--bad:#ff8a7a;--badbg:#3a1d1a}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--text:#e8ebf2;--muted:#9aa4b8;--line:#2e3545;--accent:#6aa7e8;--ok:#5fd18a;--okbg:#17321f;--bad:#ff8a7a;--badbg:#3a1d1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.4rem;margin:0 0 4px}
h2{font-size:1.1rem;margin:22px 0 4px;color:var(--accent)}
.sub{color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.pass{border-left:4px solid var(--accent)}
.pass p{margin:0 0 8px}
.q{font-weight:600;margin:0 0 10px;line-height:2.1}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.opt input{margin-top:4px}
input[type=text],textarea{box-sizing:border-box;padding:8px 10px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.card>input[type=text],textarea{width:100%}
.q input[type=text]{width:9.5em;max-width:100%;margin:0 4px;font-weight:400}
button{font-size:1rem;padding:10px 18px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.right{border-color:var(--ok)!important;background:var(--okbg)}
.wrong{border-color:var(--bad)!important;background:var(--badbg)}
.fb{margin-top:8px;font-size:.92rem;color:var(--muted)}
.tag{font-size:.8rem;color:var(--muted);font-weight:400}
.score{font-size:1.6rem;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 14px}
.bar div{height:100%;background:var(--accent);width:0}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<p class="sub" id="sub"></p>
<div class="card"><label for="name"><b>Họ và tên</b></label><input type="text" id="name" placeholder="Nguyễn Văn A" autocomplete="name" style="width:100%;margin-top:6px"></div>
<div class="bar"><div id="prog"></div></div>
<div id="quiz"></div>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<button id="submit">Nộp bài &amp; chấm điểm</button>
<button class="sec" id="reset" style="display:none">Làm lại</button>
</div>
<div class="card" id="result" style="display:none;margin-top:16px">
<div class="score" id="scoreTxt"></div>
<p class="sub">Phần tự luận giáo viên sẽ chấm riêng. Gửi nội dung bên dưới cho giáo viên (chụp màn hình hoặc sao chép).</p>
<textarea id="summary" rows="8" readonly></textarea>
</div>
</main>
<script>
/* ===== GIÁO VIÊN CHỈNH Ở ĐÂY =====
 mc: q, options[], answer (bắt đầu từ 0), why
 gap: q, answers[] (viết lại cả câu; liệt kê các đáp án chấp nhận), why
 multi: q có nhiều chỗ ___, answers[] là danh sách theo từng chỗ trống, mỗi chỗ là mảng các đáp án chấp nhận, why
 open: q (tự luận, không chấm tự động, gửi kèm bài cho giáo viên)
*/
const QUIZ = {
  title: "Buổi 7 – Unit 6: Learning and doing",
  sub: "Từ vựng chủ đề Learning and doing: topic vocabulary, phrasal verbs, cụm giới từ, word formation. Bấm “Nộp bài” để xem điểm.",
  sections: [
    {title:"Writing – Bài 1: Điền từ", note:"Điền từ thích hợp (từ vựng chủ đề, phrasal verb hoặc cụm giới từ đã học). Có thể là 1 từ hoặc 2 từ.", items:[
      {type:"multi", q:"If you don’t know a word, you should ___ it ___ in a dictionary.", answers:[["look"],["up"]], why:"look up = tra cứu."},
      {type:"multi", q:"The teacher asked us to ___ the important points ___ in our notebooks.", answers:[["write"],["down"]], why:"write down = ghi lại."},
      {type:"multi", q:"I made a mistake, so I had to ___ it ___ and write the answer again.", answers:[["cross","rub"],["out"]], why:"cross out = gạch bỏ; rub out = tẩy xóa."},
      {type:"multi", q:"She’s very ___ — she got a perfect score on every exam this term.", answers:[["clever","smart","talented"]], why:"clever / smart / talented = thông minh, có tài."},
      {type:"multi", q:"In ___, I think online courses are a great way to learn new skills.", answers:[["conclusion"]], why:"in conclusion = tóm lại."},
      {type:"multi", q:"He’s really ___ maths — he never needs to study for tests.", answers:[["good at","talented at"]], why:"good at / talented at + môn học."}
    ]},
    {title:"Writing – Bài 2: Word formation", note:"Điền dạng đúng của từ trong ngoặc.", items:[
      {type:"multi", q:"The teacher gave us clear ___ before the test. (INSTRUCT)", answers:[["instructions","instruction"]], why:"instruct → instruction(s) (n). Thường dùng số nhiều: instructions."},
      {type:"multi", q:"I try to write difficult words down to help my ___. (MEMORY)", answers:[["memory"]], why:"Sau “my” cần danh từ: memory."},
      {type:"multi", q:"It’s important to get a good ___ if you want to be a doctor. (EDUCATE)", answers:[["education"]], why:"educate → education (n)."}
    ]},
    {title:"Luyện thêm – Cụm giới từ và word patterns", note:"Phần bổ sung từ bảng lý thuyết. Điền một từ.", items:[
      {type:"multi", q:"I can’t say the poem by ___ yet.", answers:[["heart"]], why:"by heart = thuộc lòng."},
      {type:"multi", q:"Many sports are popular. ___ instance, football is played in almost every country.", answers:[["for"]], why:"for instance = ví dụ như."},
      {type:"multi", q:"___ fact, I’ve never failed an exam.", answers:[["in"]], why:"in fact = thực tế là."},
      {type:"multi", q:"She’s capable ___ passing the exam.", answers:[["of"]], why:"capable of + V-ing."},
      {type:"multi", q:"He succeeded ___ getting a place at university.", answers:[["in"]], why:"succeed in + V-ing."},
      {type:"multi", q:"I find it hard to cope ___ stress before exams.", answers:[["with"]], why:"cope with."}
    ]},
    {title:"Writing – Bài 3: Đoạn văn", note:"Phần này giáo viên chấm riêng.", items:[
      {type:"open", q:"Viết 6–8 câu về cách học tập hiệu quả của bạn (How I study effectively): bạn tập trung như thế nào, làm gì khi gặp khó khăn, đã đạt được điều gì. Dùng ít nhất 5 từ vựng của Unit 6 và đặt các từ đó trong dấu [ ] (ví dụ: [concentrate])."}
    ]},
    {title:"Reading – How to Learn a New Skill", passage:[
      "Learning a new skill isn’t always easy, but a few simple habits can help you make progress faster. First, make sure you understand the instructions before you start — if you don’t, don’t hesitate to ask questions.",
      "Second, try to concentrate on one skill at a time instead of trying to learn everything at once. Many experts point out that focusing on a single subject helps the brain remember information more easily. For instance, if you’re learning a language, it’s often better to practise a little every day than to study for hours once a week.",
      "Finally, don’t be afraid to fail. Even talented people fail sometimes — it’s a normal part of learning. In fact, many successful people say that their mistakes helped them achieve their goals in the end."
    ], items:[
      {type:"mc", q:"What should you do before you start learning something new?", options:["Make sure you understand the instructions","Take an exam","Find an expert to do it for you","Learn everything at once"], answer:0, why:"“make sure you understand the instructions before you start”."},
      {type:"mc", q:"Why do experts recommend focusing on one skill at a time?", options:["It helps the brain remember information more easily","It makes learning faster than any other method","It is cheaper","It means you never fail"], answer:0, why:"“focusing on a single subject helps the brain remember information more easily”."},
      {type:"mc", q:"What example does the text give about learning a language?", options:["Practise a little every day rather than studying for hours once a week","Study for many hours once a week","Learn a hundred words in one day","Only practise before an exam"], answer:0, why:"“it’s often better to practise a little every day than to study for hours once a week”."},
      {type:"mc", q:"According to the text, is it normal to fail while learning something new?", options:["Yes, it is a normal part of learning","No, only people who are not talented fail","No, you should always avoid it","Only experts fail"], answer:0, why:"“it’s a normal part of learning”."},
      {type:"open", q:"Do you agree that mistakes can help you achieve your goals? Give an example from your own experience. (viết câu đầy đủ)"},
      {type:"open", q:"Tìm trong bài đọc 6 từ/cụm từ thuộc chủ đề Unit 6 (topic vocabulary, phrasal verb hoặc prepositional phrase) và viết nghĩa tiếng Việt của chúng."},
      {type:"open", q:"Viết 2–3 câu chia sẻ một mẹo học tập bạn thấy hữu ích (a study tip that works for you)."}
    ]}
  ]
};
/* ===== HẾT PHẦN CHỈNH ===== */

const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g," ").trim().replace(/[.!?]+$/,"").trim();
const $=id=>document.getElementById(id);
const quiz=$("quiz");
$("title").textContent=QUIZ.title;$("sub").textContent=QUIZ.sub;document.title=QUIZ.title;
const ALL=[];QUIZ.sections.forEach(s=>s.items.forEach(it=>ALL.push(it)));
const graded=()=>ALL.map((it,i)=>[it,i]).filter(([it])=>it.type!=="open");
const blanks=i=>Array.from(document.querySelectorAll("#c"+i+" input[type=text]"));

function build(){
  quiz.innerHTML="";let n=0;
  QUIZ.sections.forEach(sec=>{
    const h=document.createElement("h2");h.textContent=sec.title;quiz.appendChild(h);
    if(sec.note){const p=document.createElement("p");p.className="sub";p.textContent=sec.note;quiz.appendChild(p);}
    if(sec.passage){const b=document.createElement("div");b.className="card pass";sec.passage.forEach(t=>{const p=document.createElement("p");p.textContent=t;b.appendChild(p)});quiz.appendChild(b);}
    sec.items.forEach(it=>{
      const i=n++;
      const c=document.createElement("div");c.className="card";c.id="c"+i;
      const q=document.createElement("p");q.className="q";
      if(it.type==="multi"){
        q.append((i+1)+". ");
        it.q.split("___").forEach((part,k,arr)=>{
          q.append(part);
          if(k<arr.length-1){const t=document.createElement("input");t.type="text";t.autocomplete="off";t.autocapitalize="off";t.spellcheck=false;t.oninput=progress;q.appendChild(t);}
        });
      }else{
        q.textContent=(i+1)+". "+it.q;
      }
      if(it.type==="open"){const t=document.createElement("span");t.className="tag";t.textContent=" (tự luận)";q.appendChild(t);}
      c.appendChild(q);
      if(it.type==="mc"){
        it.options.forEach((o,j)=>{
          const l=document.createElement("label");l.className="opt";
          const r=document.createElement("input");r.type="radio";r.name="q"+i;r.value=j;r.onchange=progress;
          const s=document.createElement("span");s.textContent=o;
          l.append(r,s);c.appendChild(l);
        });
      }else if(it.type==="gap"){
        const t=document.createElement("input");t.type="text";t.autocomplete="off";t.autocapitalize="off";t.spellcheck=false;t.oninput=progress;c.appendChild(t);
      }else if(it.type==="open"){
        const t=document.createElement("textarea");t.rows=4;c.appendChild(t);
      }
      const fb=document.createElement("div");fb.className="fb";fb.id="f"+i;c.appendChild(fb);
      quiz.appendChild(c);
    });
  });
  progress();
}
function answered(i){
  const it=ALL[i];
  if(it.type==="mc")return !!document.querySelector('input[name="q'+i+'"]:checked');
  return blanks(i).some(b=>b.value.trim()!=="");
}
function progress(){
  const g=graded(),n=g.filter(([,i])=>answered(i)).length;
  $("prog").style.width=(100*n/g.length)+"%";
}
function grade(){
  let score=0;
  graded().forEach(([it,i])=>{
    const c=$("c"+i),fb=$("f"+i);let ok=false,shown="";
    if(it.type==="mc"){
      const ch=document.querySelector('input[name="q'+i+'"]:checked');
      ok=!!ch&&+ch.value===it.answer;shown=it.options[it.answer];
      c.querySelectorAll(".opt").forEach((l,j)=>{
        l.classList.remove("right","wrong");
        if(j===it.answer)l.classList.add("right");else if(ch&&+ch.value===j)l.classList.add("wrong");
        l.querySelector("input").disabled=true;
      });
    }else if(it.type==="multi"){
      const bs=blanks(i);ok=true;
      bs.forEach((b,k)=>{
        const good=it.answers[k].some(a=>norm(a)===norm(b.value));
        b.classList.remove("right","wrong");b.classList.add(good?"right":"wrong");b.disabled=true;
        if(!good)ok=false;
      });
      shown=it.answers.map(a=>a[0]).join(" … ");
    }else{
      const t=blanks(i)[0];ok=it.answers.some(a=>norm(a)===norm(t.value));shown=it.answers[0];
      t.classList.remove("right","wrong");t.classList.add(ok?"right":"wrong");t.disabled=true;
    }
    if(ok)score++;
    fb.textContent=(ok?"✓ Đúng. ":"✗ Sai. Đáp án: "+shown+". ")+(it.why||"");
  });
  ALL.forEach((it,i)=>{if(it.type==="open"){document.querySelector("#c"+i+" textarea").readOnly=true;$("f"+i).textContent="Giáo viên sẽ chấm phần này.";}});
  const total=graded().length,name=$("name").value.trim()||"(chưa nhập tên)";
  $("scoreTxt").textContent="Điểm tự động: "+score+"/"+total+" ("+Math.round(100*score/total)/10+"/10)";
  let s=name+" – "+QUIZ.title+"\nĐiểm tự động: "+score+"/"+total+"\nNgày: "+new Date().toLocaleString("vi-VN");
  ALL.forEach((it,i)=>{if(it.type==="open"){const v=document.querySelector("#c"+i+" textarea").value.trim();s+="\n\n["+(i+1)+"] "+(v||"(bỏ trống)");}});
  $("summary").value=s;
  $("result").style.display="block";$("reset").style.display="inline-block";$("submit").style.display="none";
  $("result").scrollIntoView({behavior:"smooth"});
}
$("submit").onclick=()=>{
  const left=graded().filter(([,i])=>!answered(i)).length;
  if(left&&!confirm("Còn "+left+" câu chưa làm. Vẫn nộp bài?"))return;
  grade();
};
$("reset").onclick=()=>{build();$("result").style.display="none";$("reset").style.display="none";$("submit").style.display="inline-block";window.scrollTo({top:0,behavior:"smooth"})};
build();
</script>
</body>
</html>
