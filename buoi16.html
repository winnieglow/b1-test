<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buổi 16 – Review 4: Units 10, 11, 12</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#5d6678;--line:#dfe3ec;--accent:#2b6cb0;--ok:#1f8a4c;--okbg:#e4f5ea;--bad:#c0392b;--badbg:#fbe9e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--text:#e8ebf2;--muted:#9aa4b8;--line:#2e3545;--accent:#6aa7e8;--ok:#5fd18a;--okbg:#17321f;--bad:#ff8a7a;--badbg:#3a1d1a}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--text:#e8ebf2;--muted:#9aa4b8;--line:#2e3545;--accent:#6aa7e8;--ok:#5fd18a;--okbg:#17321f;--bad:#ff8a7a;--badbg:#3a1d1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.4rem;margin:0 0 4px}
h2{font-size:1.1rem;margin:22px 0 4px;color:var(--accent)}
.sub{color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.pass{border-left:4px solid var(--accent)}
.pass p{margin:0 0 8px}
.q{font-weight:600;margin:0 0 10px;line-height:2.1}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.opt input{margin-top:4px}
input[type=text],textarea{box-sizing:border-box;padding:8px 10px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.card>input[type=text],textarea{width:100%}
.q input[type=text]{width:9.5em;max-width:100%;margin:0 4px;font-weight:400}
button{font-size:1rem;padding:10px 18px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.right{border-color:var(--ok)!important;background:var(--okbg)}
.wrong{border-color:var(--bad)!important;background:var(--badbg)}
.fb{margin-top:8px;font-size:.92rem;color:var(--muted)}
.tag{font-size:.8rem;color:var(--muted);font-weight:400}
.score{font-size:1.6rem;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 14px}
.bar div{height:100%;background:var(--accent);width:0}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<p class="sub" id="sub"></p>
<div class="card"><label for="name"><b>Họ và tên</b></label><input type="text" id="name" placeholder="Nguyễn Văn A" autocomplete="name" style="width:100%;margin-top:6px"></div>
<div class="bar"><div id="prog"></div></div>
<div id="quiz"></div>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<button id="submit">Nộp bài &amp; chấm điểm</button>
<button class="sec" id="reset" style="display:none">Làm lại</button>
</div>
<div class="card" id="result" style="display:none;margin-top:16px">
<div class="score" id="scoreTxt"></div>
<p class="sub">Phần tự luận giáo viên sẽ chấm riêng. Gửi nội dung bên dưới cho giáo viên (chụp màn hình hoặc sao chép).</p>
<textarea id="summary" rows="8" readonly></textarea>
</div>
</main>
<script>
/* ===== GIÁO VIÊN CHỈNH Ở ĐÂY =====
 mc: q, options[], answer (bắt đầu từ 0), why
 gap: q, answers[] (viết lại cả câu; liệt kê các đáp án chấp nhận), why
 multi: q có nhiều chỗ ___, answers[] là danh sách theo từng chỗ trống, mỗi chỗ là mảng các đáp án chấp nhận, why
 open: q (tự luận, không chấm tự động, gửi kèm bài cho giáo viên)
*/
const QUIZ = {
  title: "Buổi 16 – Review 4: Units 10, 11, 12",
  sub: "Ôn tập câu bị động ở nhiều thì và từ vựng Unit 12. Bấm “Nộp bài” để xem điểm.",
  sections: [
    {title:"Kiểm tra ôn tập – Phần A: Chuyển sang câu bị động", note:"Chuyển sang câu bị động, giữ đúng thì. Viết lại cả câu. Có thể bỏ phần “by …” nếu không cần.", items:[
      {type:"gap", q:"Someone repairs this machine every month.", answers:["This machine is repaired every month","Every month this machine is repaired","Every month, this machine is repaired"], why:"Present simple bị động: is/are + V3."},
      {type:"gap", q:"They cancelled the flight yesterday.", answers:["The flight was cancelled yesterday","The flight was canceled yesterday","Yesterday the flight was cancelled","Yesterday, the flight was cancelled","Yesterday the flight was canceled","Yesterday, the flight was canceled"], why:"Past simple bị động: was/were + V3."},
      {type:"gap", q:"The company is building a new factory right now.", answers:["A new factory is being built right now","A new factory is being built by the company right now","Right now a new factory is being built","Right now, a new factory is being built"], why:"Present continuous bị động: is/are being + V3."},
      {type:"gap", q:"Someone has already fixed the printer.", answers:["The printer has already been fixed","The printer has been fixed already"], why:"Present perfect bị động: has/have been + V3."},
      {type:"gap", q:"They will announce the winner tomorrow.", answers:["The winner will be announced tomorrow","Tomorrow the winner will be announced","Tomorrow, the winner will be announced"], why:"will + be + V3."},
      {type:"gap", q:"You must return this book by Friday.", answers:["This book must be returned by Friday"], why:"Modal bị động: must + be + V3."}
    ]},
    {title:"Kiểm tra ôn tập – Phần B: Phrasal verb và từ vựng Unit 12", note:"Điền phrasal verb hoặc từ vựng Unit 12 phù hợp, chia đúng dạng nếu cần.", items:[
      {type:"multi", q:"We ___ ___ really well — we never argue.", answers:[["get"],["on"]], why:"get on (with) = hòa hợp."},
      {type:"multi", q:"She was ___ when her friend forgot her birthday. (let down)", answers:[["let down","disappointed"]], why:"let down = làm ai thất vọng (be let down = bị thất vọng)."},
      {type:"multi", q:"They decided to ___ ___ after years together.", answers:[["split","break"],["up"]], why:"split up = chia tay."},
      {type:"multi", q:"He’s very ___ — he always shares what he has with others.", answers:[["generous"]], why:"generous (adj) = hào phóng."},
      {type:"multi", q:"I’m ___ of my brother — he always achieves his goals.", answers:[["proud"]], why:"proud of = tự hào về."}
    ]},
    {title:"Kiểm tra ôn tập – Phần C: Viết lại câu", note:"Giữ nguyên nghĩa, dùng từ gợi ý (2–5 từ). Chỉ điền phần còn thiếu.", items:[
      {type:"multi", q:"Someone stole my phone last night. (WAS) → My phone ___ last night.", answers:[["was stolen"]], why:"Past simple bị động: was + V3."},
      {type:"multi", q:"They are cleaning the office at the moment. (BEING) → The office ___ at the moment.", answers:[["is being cleaned"]], why:"Present continuous bị động: is being + V3."},
      {type:"multi", q:"It isn’t necessary for you to finish this today. (DOESN’T) → This ___ today.", answers:[["doesn't have to be finished","does not have to be finished","doesn't need to be finished","does not need to be finished"]], why:"doesn’t have to / need to + be + V3."}
    ]},
    {title:"Writing – Bài 1: Hoàn thành đoạn văn", note:"Dùng dạng bị động đúng của động từ trong ngoặc.", items:[
      {type:"multi", q:"Last year, a small party ___ (organise) for my grandmother’s eightieth birthday.", answers:[["was organised","was organized"]], why:"Past simple bị động."},
      {type:"multi", q:"The house ___ (already/decorate) by the time the guests arrived, and a big cake ___ (bring) by my aunt.", answers:[["had already been decorated"],["was brought"]], why:"had already been decorated (xảy ra trước, past perfect bị động); was brought (past simple bị động)."},
      {type:"multi", q:"My grandmother ___ (surprise) completely — she had no idea anything ___ (plan)!", answers:[["was surprised"],["had been planned"]], why:"was surprised (past simple bị động); had been planned (past perfect bị động, xảy ra trước)."},
      {type:"multi", q:"Everyone she loved ___ (invite), and she felt very grateful.", answers:[["was invited"]], why:"Past simple bị động."},
      {type:"multi", q:"It’s a day that ___ (never/forget) by our family.", answers:[["will never be forgotten","'ll never be forgotten","is never forgotten"]], why:"will never be forgotten (hoặc is never forgotten)."}
    ]},
    {title:"Writing – Bài 2: Đoạn văn", note:"Phần này giáo viên chấm riêng.", items:[
      {type:"open", q:"Viết 8–10 câu về “An important relationship in your life” (bạn thân, người thân, hàng xóm...). Bắt buộc dùng: ít nhất 2 câu bị động và ít nhất 4 từ vựng Unit 12."}
    ]},
    {title:"Reading – A Surprise Reunion", passage:[
      "Last month, a class reunion was organised for former students who hadn’t seen each other in over ten years. The event was planned by two old friends, Lan and Huy, who had stayed in contact since school. Invitations were sent to everyone whose address could be found.",
      "On the day of the event, the hall was being decorated when the first guests arrived. Many people were recognised immediately, but others had changed so much that they had to be introduced again. “I couldn’t believe how grateful everyone was to be there,” Lan said. “So many friendships that had been lost were suddenly found again.”",
      "By the end of the night, several new plans had already been made — a group chat was created so that everyone could stay in contact, and it was agreed that the reunion would be held again next year. For many, old bonds that had been broken by time were finally repaired."
    ], items:[
      {type:"mc", q:"Who organised the class reunion, and who was it for?", options:["Lan and Huy; former students who hadn’t seen each other in over ten years","The school; current students","Two teachers; all the neighbours","A charity; elderly residents"], answer:0, why:"“a class reunion was organised for former students … planned by two old friends, Lan and Huy”."},
      {type:"mc", q:"What was happening to the hall when the first guests arrived?", options:["It was being decorated","It was being cleaned","It was being repaired","It was being locked"], answer:0, why:"“the hall was being decorated when the first guests arrived”."},
      {type:"mc", q:"Why did some people need to be introduced again?", options:["They had changed so much","They had forgotten their names","They were wearing masks","They had never met before"], answer:0, why:"“others had changed so much that they had to be introduced again”."},
      {type:"mc", q:"What plans were made by the end of the night?", options:["A group chat was created and the reunion would be held again next year","The school was going to be sold","A new class would be started","The hall would be decorated again"], answer:0, why:"“a group chat was created … it was agreed that the reunion would be held again next year”."},
      {type:"open", q:"Have you ever been to a reunion with old friends or classmates? How did it feel? (viết câu đầy đủ)"},
      {type:"open", q:"Tìm trong bài đọc 6 câu bị động ở các thì/cấu trúc khác nhau. Viết lại các câu đó và cho biết mỗi câu ở thì gì."}
    ]}
  ]
};
/* ===== HẾT PHẦN CHỈNH ===== */

const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g," ").trim().replace(/[.!?]+$/,"").trim();
const $=id=>document.getElementById(id);
const quiz=$("quiz");
$("title").textContent=QUIZ.title;$("sub").textContent=QUIZ.sub;document.title=QUIZ.title;
const ALL=[];QUIZ.sections.forEach(s=>s.items.forEach(it=>ALL.push(it)));
const graded=()=>ALL.map((it,i)=>[it,i]).filter(([it])=>it.type!=="open");
const blanks=i=>Array.from(document.querySelectorAll("#c"+i+" input[type=text]"));

function build(){
  quiz.innerHTML="";let n=0;
  QUIZ.sections.forEach(sec=>{
    const h=document.createElement("h2");h.textContent=sec.title;quiz.appendChild(h);
    if(sec.note){const p=document.createElement("p");p.className="sub";p.textContent=sec.note;quiz.appendChild(p);}
    if(sec.passage){const b=document.createElement("div");b.className="card pass";sec.passage.forEach(t=>{const p=document.createElement("p");p.textContent=t;b.appendChild(p)});quiz.appendChild(b);}
    sec.items.forEach(it=>{
      const i=n++;
      const c=document.createElement("div");c.className="card";c.id="c"+i;
      const q=document.createElement("p");q.className="q";
      if(it.type==="multi"){
        q.append((i+1)+". ");
        it.q.split("___").forEach((part,k,arr)=>{
          q.append(part);
          if(k<arr.length-1){const t=document.createElement("input");t.type="text";t.autocomplete="off";t.autocapitalize="off";t.spellcheck=false;t.oninput=progress;q.appendChild(t);}
        });
      }else{
        q.textContent=(i+1)+". "+it.q;
      }
      if(it.type==="open"){const t=document.createElement("span");t.className="tag";t.textContent=" (tự luận)";q.appendChild(t);}
      c.appendChild(q);
      if(it.type==="mc"){
        it.options.forEach((o,j)=>{
          const l=document.createElement("label");l.className="opt";
          const r=document.createElement("input");r.type="radio";r.name="q"+i;r.value=j;r.onchange=progress;
          const s=document.createElement("span");s.textContent=o;
          l.append(r,s);c.appendChild(l);
        });
      }else if(it.type==="gap"){
        const t=document.createElement("input");t.type="text";t.autocomplete="off";t.autocapitalize="off";t.spellcheck=false;t.oninput=progress;c.appendChild(t);
      }else if(it.type==="open"){
        const t=document.createElement("textarea");t.rows=4;c.appendChild(t);
      }
      const fb=document.createElement("div");fb.className="fb";fb.id="f"+i;c.appendChild(fb);
      quiz.appendChild(c);
    });
  });
  progress();
}
function answered(i){
  const it=ALL[i];
  if(it.type==="mc")return !!document.querySelector('input[name="q'+i+'"]:checked');
  return blanks(i).some(b=>b.value.trim()!=="");
}
function progress(){
  const g=graded(),n=g.filter(([,i])=>answered(i)).length;
  $("prog").style.width=(100*n/g.length)+"%";
}
function grade(){
  let score=0;
  graded().forEach(([it,i])=>{
    const c=$("c"+i),fb=$("f"+i);let ok=false,shown="";
    if(it.type==="mc"){
      const ch=document.querySelector('input[name="q'+i+'"]:checked');
      ok=!!ch&&+ch.value===it.answer;shown=it.options[it.answer];
      c.querySelectorAll(".opt").forEach((l,j)=>{
        l.classList.remove("right","wrong");
        if(j===it.answer)l.classList.add("right");else if(ch&&+ch.value===j)l.classList.add("wrong");
        l.querySelector("input").disabled=true;
      });
    }else if(it.type==="multi"){
      const bs=blanks(i);ok=true;
      bs.forEach((b,k)=>{
        const good=it.answers[k].some(a=>norm(a)===norm(b.value));
        b.classList.remove("right","wrong");b.classList.add(good?"right":"wrong");b.disabled=true;
        if(!good)ok=false;
      });
      shown=it.answers.map(a=>a[0]).join(" … ");
    }else{
      const t=blanks(i)[0];ok=it.answers.some(a=>norm(a)===norm(t.value));shown=it.answers[0];
      t.classList.remove("right","wrong");t.classList.add(ok?"right":"wrong");t.disabled=true;
    }
    if(ok)score++;
    fb.textContent=(ok?"✓ Đúng. ":"✗ Sai. Đáp án: "+shown+". ")+(it.why||"");
  });
  ALL.forEach((it,i)=>{if(it.type==="open"){document.querySelector("#c"+i+" textarea").readOnly=true;$("f"+i).textContent="Giáo viên sẽ chấm phần này.";}});
  const total=graded().length,name=$("name").value.trim()||"(chưa nhập tên)";
  $("scoreTxt").textContent="Điểm tự động: "+score+"/"+total+" ("+Math.round(100*score/total)/10+"/10)";
  let s=name+" – "+QUIZ.title+"\nĐiểm tự động: "+score+"/"+total+"\nNgày: "+new Date().toLocaleString("vi-VN");
  ALL.forEach((it,i)=>{if(it.type==="open"){const v=document.querySelector("#c"+i+" textarea").value.trim();s+="\n\n["+(i+1)+"] "+(v||"(bỏ trống)");}});
  $("summary").value=s;
  $("result").style.display="block";$("reset").style.display="inline-block";$("submit").style.display="none";
  $("result").scrollIntoView({behavior:"smooth"});
}
$("submit").onclick=()=>{
  const left=graded().filter(([,i])=>!answered(i)).length;
  if(left&&!confirm("Còn "+left+" câu chưa làm. Vẫn nộp bài?"))return;
  grade();
};
$("reset").onclick=()=>{build();$("result").style.display="none";$("reset").style.display="none";$("submit").style.display="inline-block";window.scrollTo({top:0,behavior:"smooth"})};
build();
</script>
</body>
</html>
