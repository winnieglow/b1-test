<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buổi 14 – Unit 11: The passive 2</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#5d6678;--line:#dfe3ec;--accent:#2b6cb0;--ok:#1f8a4c;--okbg:#e4f5ea;--bad:#c0392b;--badbg:#fbe9e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--text:#e8ebf2;--muted:#9aa4b8;--line:#2e3545;--accent:#6aa7e8;--ok:#5fd18a;--okbg:#17321f;--bad:#ff8a7a;--badbg:#3a1d1a}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--text:#e8ebf2;--muted:#9aa4b8;--line:#2e3545;--accent:#6aa7e8;--ok:#5fd18a;--okbg:#17321f;--bad:#ff8a7a;--badbg:#3a1d1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.4rem;margin:0 0 4px}
h2{font-size:1.1rem;margin:22px 0 4px;color:var(--accent)}
.sub{color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.pass{border-left:4px solid var(--accent)}
.pass p{margin:0 0 8px}
.q{font-weight:600;margin:0 0 10px;line-height:2.1}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.opt input{margin-top:4px}
input[type=text],textarea{box-sizing:border-box;padding:8px 10px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.card>input[type=text],textarea{width:100%}
.q input[type=text]{width:9.5em;max-width:100%;margin:0 4px;font-weight:400}
button{font-size:1rem;padding:10px 18px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.right{border-color:var(--ok)!important;background:var(--okbg)}
.wrong{border-color:var(--bad)!important;background:var(--badbg)}
.fb{margin-top:8px;font-size:.92rem;color:var(--muted)}
.tag{font-size:.8rem;color:var(--muted);font-weight:400}
.score{font-size:1.6rem;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 14px}
.bar div{height:100%;background:var(--accent);width:0}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<p class="sub" id="sub"></p>
<div class="card"><label for="name"><b>Họ và tên</b></label><input type="text" id="name" placeholder="Nguyễn Văn A" autocomplete="name" style="width:100%;margin-top:6px"></div>
<div class="bar"><div id="prog"></div></div>
<div id="quiz"></div>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<button id="submit">Nộp bài &amp; chấm điểm</button>
<button class="sec" id="reset" style="display:none">Làm lại</button>
</div>
<div class="card" id="result" style="display:none;margin-top:16px">
<div class="score" id="scoreTxt"></div>
<p class="sub">Phần tự luận giáo viên sẽ chấm riêng. Gửi nội dung bên dưới cho giáo viên (chụp màn hình hoặc sao chép).</p>
<textarea id="summary" rows="8" readonly></textarea>
</div>
</main>
<script>
/* ===== GIÁO VIÊN CHỈNH Ở ĐÂY =====
 mc: q, options[], answer (bắt đầu từ 0), why
 gap: q, answers[] (viết lại cả câu; liệt kê các đáp án chấp nhận), why
 multi: q có nhiều chỗ ___, answers[] là danh sách theo từng chỗ trống, mỗi chỗ là mảng các đáp án chấp nhận, why
 open: q (tự luận, không chấm tự động, gửi kèm bài cho giáo viên)
*/
const QUIZ = {
  title: "Buổi 14 – Unit 11: The passive 2",
  sub: "Câu bị động nâng cao: present continuous, present perfect, past continuous, past perfect, be going to, modals; by và with. Bấm “Nộp bài” để xem điểm.",
  sections: [
    {title:"Writing – Bài 1: Chuyển sang câu bị động", note:"Chuyển sang câu bị động, giữ đúng thì. Viết lại cả câu. Có thể bỏ phần “by …” nếu không cần.", items:[
      {type:"gap", q:"Someone is cleaning the classroom right now.", answers:["The classroom is being cleaned right now","Right now the classroom is being cleaned","Right now, the classroom is being cleaned"], why:"Present continuous bị động: is/are being + V3."},
      {type:"gap", q:"The company has already sent the package.", answers:["The package has already been sent","The package has already been sent by the company","The package has been sent already","The package has been sent already by the company"], why:"Present perfect bị động: has/have been + V3."},
      {type:"gap", q:"Workers were building the bridge when the storm hit.", answers:["The bridge was being built when the storm hit","The bridge was being built by workers when the storm hit"], why:"Past continuous bị động: was/were being + V3."},
      {type:"gap", q:"They had finished the project before the deadline.", answers:["The project had been finished before the deadline"], why:"Past perfect bị động: had been + V3."},
      {type:"gap", q:"They’re going to open a new shop next month.", answers:["A new shop is going to be opened next month","A new shop's going to be opened next month","Next month a new shop is going to be opened","Next month, a new shop is going to be opened"], why:"be going to bị động: is/are going to be + V3."},
      {type:"gap", q:"You should return the books by Friday.", answers:["The books should be returned by Friday","The books should be returned by Friday by you"], why:"Modal bị động: should + be + V3."}
    ]},
    {title:"Writing – Bài 2: Dạng bị động đúng", note:"Điền dạng bị động đúng của động từ trong ngoặc.", items:[
      {type:"multi", q:"The report ___ (still/write) — it’s not ready yet.", answers:[["is still being written"]], why:"Present continuous bị động; still đứng sau is."},
      {type:"multi", q:"This song ___ (already/download) millions of times.", answers:[["has already been downloaded","'s already been downloaded"]], why:"Present perfect bị động: has already been downloaded."},
      {type:"multi", q:"The car ___ (repair) when I called the garage yesterday.", answers:[["was being repaired"]], why:"Past continuous bị động: was being repaired."},
      {type:"multi", q:"All the tickets ___ (must/check) before the show starts.", answers:[["must be checked"]], why:"Modal bị động: must + be + V3."},
      {type:"multi", q:"This bridge ___ (might/close) next week for repairs.", answers:[["might be closed"]], why:"Modal bị động: might + be + V3."}
    ]},
    {title:"Luyện thêm – by hay with?", note:"Phần bổ sung từ phần lý thuyết: by nhấn mạnh ai làm, with nhấn mạnh dùng cái gì. Điền by hoặc with.", items:[
      {type:"multi", q:"Soup is usually eaten ___ a spoon.", answers:[["with"]], why:"with + dụng cụ."},
      {type:"multi", q:"My sister’s bedroom was painted ___ my parents.", answers:[["by"]], why:"by + người thực hiện."},
      {type:"multi", q:"The window was broken ___ a stone.", answers:[["with"]], why:"with + vật dùng để làm."},
      {type:"multi", q:"This song was written ___ a famous singer.", answers:[["by"]], why:"by + người thực hiện."},
      {type:"multi", q:"The letter was written ___ a blue pen.", answers:[["with"]], why:"with + dụng cụ."},
      {type:"multi", q:"The picture was painted ___ Picasso.", answers:[["by"]], why:"by + người thực hiện."}
    ]},
    {title:"Writing – Bài 3: Đoạn văn", note:"Phần này giáo viên chấm riêng.", items:[
      {type:"open", q:"Viết 6–8 câu miêu tả công tác chuẩn bị cho một sự kiện (Preparing for an event — wedding, birthday party, festival...). Dùng ít nhất 5 câu bị động với các thì/cấu trúc khác nhau đã học (present continuous, present perfect, be going to, modals)."}
    ]},
    {title:"Reading – Preparing for the Festival", passage:[
      "The town’s summer festival is going to be held next weekend, and preparations are already under way. Right now, the main stage is being built in the town square, and the streets are being decorated with colourful lights.",
      "According to the organiser, all the food stalls have already been booked, and tickets have been sold to over two thousand people. “Everything must be finished by Friday,” she said. “The stage should be tested on Thursday evening to make sure everything works.”",
      "Last year, the festival was almost cancelled because heavy rain had damaged the equipment the night before. This year, extra tents are being set up just in case. The organisers hope the festival will be enjoyed by everyone, whatever the weather!"
    ], items:[
      {type:"mc", q:"What is being built and decorated right now?", options:["The main stage is being built and the streets are being decorated with lights","The food stalls are being built and the tents are being decorated","The town hall is being built and the square is being painted","The tickets are being printed and the stage is being sold"], answer:0, why:"“the main stage is being built in the town square, and the streets are being decorated with colourful lights”."},
      {type:"mc", q:"What has already been done, according to the organiser?", options:["All the food stalls have been booked and tickets have been sold to over two thousand people","The stage has been tested and the lights have been removed","The festival has been cancelled and the tickets have been refunded","The tents have been taken down and the equipment has been repaired"], answer:0, why:"“all the food stalls have already been booked, and tickets have been sold to over two thousand people”."},
      {type:"mc", q:"What should happen on Thursday evening?", options:["The stage should be tested","The festival should be opened","The tickets should be sold","The tents should be taken down"], answer:0, why:"“The stage should be tested on Thursday evening”."},
      {type:"mc", q:"Why was last year’s festival almost cancelled?", options:["Heavy rain had damaged the equipment the night before","There were not enough tickets","The stage was not finished","The organiser was ill"], answer:0, why:"“heavy rain had damaged the equipment the night before”."},
      {type:"open", q:"Have you ever helped prepare for an event? What was being done? (viết câu đầy đủ)"},
      {type:"open", q:"Tìm trong bài đọc: 2 câu bị động ở present continuous, 2 câu ở present perfect, 1 câu với modal, và 1 câu ở past perfect. Viết lại các câu đó."}
    ]}
  ]
};
/* ===== HẾT PHẦN CHỈNH ===== */

const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g," ").trim().replace(/[.!?]+$/,"").trim();
const $=id=>document.getElementById(id);
const quiz=$("quiz");
$("title").textContent=QUIZ.title;$("sub").textContent=QUIZ.sub;document.title=QUIZ.title;
const ALL=[];QUIZ.sections.forEach(s=>s.items.forEach(it=>ALL.push(it)));
const graded=()=>ALL.map((it,i)=>[it,i]).filter(([it])=>it.type!=="open");
const blanks=i=>Array.from(document.querySelectorAll("#c"+i+" input[type=text]"));

function build(){
  quiz.innerHTML="";let n=0;
  QUIZ.sections.forEach(sec=>{
    const h=document.createElement("h2");h.textContent=sec.title;quiz.appendChild(h);
    if(sec.note){const p=document.createElement("p");p.className="sub";p.textContent=sec.note;quiz.appendChild(p);}
    if(sec.passage){const b=document.createElement("div");b.className="card pass";sec.passage.forEach(t=>{const p=document.createElement("p");p.textContent=t;b.appendChild(p)});quiz.appendChild(b);}
    sec.items.forEach(it=>{
      const i=n++;
      const c=document.createElement("div");c.className="card";c.id="c"+i;
      const q=document.createElement("p");q.className="q";
      if(it.type==="multi"){
        q.append((i+1)+". ");
        it.q.split("___").forEach((part,k,arr)=>{
          q.append(part);
          if(k<arr.length-1){const t=document.createElement("input");t.type="text";t.autocomplete="off";t.autocapitalize="off";t.spellcheck=false;t.oninput=progress;q.appendChild(t);}
        });
      }else{
        q.textContent=(i+1)+". "+it.q;
      }
      if(it.type==="open"){const t=document.createElement("span");t.className="tag";t.textContent=" (tự luận)";q.appendChild(t);}
      c.appendChild(q);
      if(it.type==="mc"){
        it.options.forEach((o,j)=>{
          const l=document.createElement("label");l.className="opt";
          const r=document.createElement("input");r.type="radio";r.name="q"+i;r.value=j;r.onchange=progress;
          const s=document.createElement("span");s.textContent=o;
          l.append(r,s);c.appendChild(l);
        });
      }else if(it.type==="gap"){
        const t=document.createElement("input");t.type="text";t.autocomplete="off";t.autocapitalize="off";t.spellcheck=false;t.oninput=progress;c.appendChild(t);
      }else if(it.type==="open"){
        const t=document.createElement("textarea");t.rows=4;c.appendChild(t);
      }
      const fb=document.createElement("div");fb.className="fb";fb.id="f"+i;c.appendChild(fb);
      quiz.appendChild(c);
    });
  });
  progress();
}
function answered(i){
  const it=ALL[i];
  if(it.type==="mc")return !!document.querySelector('input[name="q'+i+'"]:checked');
  return blanks(i).some(b=>b.value.trim()!=="");
}
function progress(){
  const g=graded(),n=g.filter(([,i])=>answered(i)).length;
  $("prog").style.width=(100*n/g.length)+"%";
}
function grade(){
  let score=0;
  graded().forEach(([it,i])=>{
    const c=$("c"+i),fb=$("f"+i);let ok=false,shown="";
    if(it.type==="mc"){
      const ch=document.querySelector('input[name="q'+i+'"]:checked');
      ok=!!ch&&+ch.value===it.answer;shown=it.options[it.answer];
      c.querySelectorAll(".opt").forEach((l,j)=>{
        l.classList.remove("right","wrong");
        if(j===it.answer)l.classList.add("right");else if(ch&&+ch.value===j)l.classList.add("wrong");
        l.querySelector("input").disabled=true;
      });
    }else if(it.type==="multi"){
      const bs=blanks(i);ok=true;
      bs.forEach((b,k)=>{
        const good=it.answers[k].some(a=>norm(a)===norm(b.value));
        b.classList.remove("right","wrong");b.classList.add(good?"right":"wrong");b.disabled=true;
        if(!good)ok=false;
      });
      shown=it.answers.map(a=>a[0]).join(" … ");
    }else{
      const t=blanks(i)[0];ok=it.answers.some(a=>norm(a)===norm(t.value));shown=it.answers[0];
      t.classList.remove("right","wrong");t.classList.add(ok?"right":"wrong");t.disabled=true;
    }
    if(ok)score++;
    fb.textContent=(ok?"✓ Đúng. ":"✗ Sai. Đáp án: "+shown+". ")+(it.why||"");
  });
  ALL.forEach((it,i)=>{if(it.type==="open"){document.querySelector("#c"+i+" textarea").readOnly=true;$("f"+i).textContent="Giáo viên sẽ chấm phần này.";}});
  const total=graded().length,name=$("name").value.trim()||"(chưa nhập tên)";
  $("scoreTxt").textContent="Điểm tự động: "+score+"/"+total+" ("+Math.round(100*score/total)/10+"/10)";
  let s=name+" – "+QUIZ.title+"\nĐiểm tự động: "+score+"/"+total+"\nNgày: "+new Date().toLocaleString("vi-VN");
  ALL.forEach((it,i)=>{if(it.type==="open"){const v=document.querySelector("#c"+i+" textarea").value.trim();s+="\n\n["+(i+1)+"] "+(v||"(bỏ trống)");}});
  $("summary").value=s;
  $("result").style.display="block";$("reset").style.display="inline-block";$("submit").style.display="none";
  $("result").scrollIntoView({behavior:"smooth"});
}
$("submit").onclick=()=>{
  const left=graded().filter(([,i])=>!answered(i)).length;
  if(left&&!confirm("Còn "+left+" câu chưa làm. Vẫn nộp bài?"))return;
  grade();
};
$("reset").onclick=()=>{build();$("result").style.display="none";$("reset").style.display="none";$("submit").style.display="inline-block";window.scrollTo({top:0,behavior:"smooth"})};
build();
</script>
</body>
</html>
