<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buổi 9 – Future time (Destination B1)</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#5d6678;--line:#dfe3ec;--accent:#2b6cb0;--ok:#1f8a4c;--okbg:#e4f5ea;--bad:#c0392b;--badbg:#fbe9e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--text:#e8ebf2;--muted:#9aa4b8;--line:#2e3545;--accent:#6aa7e8;--ok:#5fd18a;--okbg:#17321f;--bad:#ff8a7a;--badbg:#3a1d1a}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--text:#e8ebf2;--muted:#9aa4b8;--line:#2e3545;--accent:#6aa7e8;--ok:#5fd18a;--okbg:#17321f;--bad:#ff8a7a;--badbg:#3a1d1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.4rem;margin:0 0 4px}
h2{font-size:1.1rem;margin:22px 0 4px;color:var(--accent)}
.sub{color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.pass{border-left:4px solid var(--accent)}
.pass p{margin:0 0 8px}
.q{font-weight:600;margin:0 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.opt input{margin-top:4px}
input[type=text],textarea{width:100%;box-sizing:border-box;padding:10px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
button{font-size:1rem;padding:10px 18px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.right{border-color:var(--ok)!important;background:var(--okbg)}
.wrong{border-color:var(--bad)!important;background:var(--badbg)}
.fb{margin-top:8px;font-size:.92rem;color:var(--muted)}
.tag{font-size:.8rem;color:var(--muted);font-weight:400}
.score{font-size:1.6rem;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 14px}
.bar div{height:100%;background:var(--accent);width:0}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<p class="sub" id="sub"></p>
<div class="card"><label for="name"><b>Họ và tên</b></label><input type="text" id="name" placeholder="Nguyễn Văn A" autocomplete="name"></div>
<div class="bar"><div id="prog"></div></div>
<div id="quiz"></div>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<button id="submit">Nộp bài &amp; chấm điểm</button>
<button class="sec" id="reset" style="display:none">Làm lại</button>
</div>
<div class="card" id="result" style="display:none;margin-top:16px">
<div class="score" id="scoreTxt"></div>
<p class="sub">Phần tự luận giáo viên sẽ chấm riêng. Gửi nội dung bên dưới cho giáo viên (chụp màn hình hoặc sao chép).</p>
<textarea id="summary" rows="8" readonly></textarea>
</div>
</main>
<script>
/* ===== GIÁO VIÊN CHỈNH Ở ĐÂY =====
 mc: q, options[], answer (bắt đầu từ 0), why
 gap: q, answers[] (các đáp án chấp nhận), why
 open: q (tự luận, không chấm tự động, gửi kèm bài cho giáo viên)
 Mỗi section có thể có "passage" (mảng đoạn văn) để hiện bài đọc.
*/
const QUIZ = {
  title: "Buổi 9 – Future time (Destination B1, Unit 7)",
  sub: "Làm phần Writing và Reading. Chọn đúng cấu trúc: present continuous, will, be going to hay present simple. Bấm “Nộp bài” để xem điểm.",
  sections: [
    {title:"Writing – Bài 1: Chia động từ cho đúng", note:"Điền dạng đúng của động từ trong ngoặc.", items:[
      {type:"gap", q:"Look at those clouds! It ___ (rain) soon.", answers:["is going to rain","'s going to rain"], why:"Dự đoán có bằng chứng nhìn thấy (mây đen): be going to."},
      {type:"gap", q:"The train ___ (leave) at 9:15 tomorrow morning.", answers:["leaves"], why:"Lịch trình cố định: present simple."},
      {type:"gap", q:"I’ve decided — I ___ (study) medicine at university.", answers:["am going to study","'m going to study"], why:"Ý định đã quyết định, chưa sắp xếp cụ thể: be going to."},
      {type:"gap", q:"Can you hear the phone? I ___ (answer) it.", answers:["will answer","'ll answer"], why:"Quyết định ngay lúc nói: will."},
      {type:"gap", q:"We ___ (have) a party next Saturday — we’ve already invited everyone.", answers:["are having","'re having"], why:"Việc đã sắp xếp cụ thể: present continuous."},
      {type:"gap", q:"I’m sure you ___ (love) this restaurant — it’s amazing!", answers:["will love","'ll love"], why:"Dự đoán dựa trên ý kiến cá nhân: will."}
    ]},
    {title:"Writing – Bài 2: Sửa lỗi", note:"Mỗi câu có 1 lỗi về cấu trúc tương lai. Viết lại cả câu cho đúng.", items:[
      {type:"gap", q:"I’m becoming a doctor when I grow up.", answers:["I'm going to become a doctor when I grow up","I am going to become a doctor when I grow up","I'm going to be a doctor when I grow up","I am going to be a doctor when I grow up"], why:"Ý định chưa sắp xếp cụ thể: be going to."},
      {type:"gap", q:"Do you think you’re enjoying the concert next week?", answers:["Do you think you'll enjoy the concert next week","Do you think you will enjoy the concert next week","Do you think you're going to enjoy the concert next week","Do you think you are going to enjoy the concert next week"], why:"Dự đoán: will hoặc be going to, không dùng present continuous."},
      {type:"gap", q:"We’ll visit my grandma this weekend. (đã lên lịch từ tuần trước)", answers:["We're visiting my grandma this weekend","We are visiting my grandma this weekend"], why:"Việc đã sắp xếp: present continuous."}
    ]},
    {title:"Writing – Bài 3: Đoạn văn", note:"Phần này giáo viên chấm riêng.", items:[
      {type:"open", q:"Viết 6–8 câu: My plans for the next holiday. Dùng ít nhất 2 câu present continuous (đã sắp xếp), 2 câu be going to (ý định), 1 câu will (dự đoán)."}
    ]},
    {title:"Reading – Planning the School Trip", passage:[
      "Next month, our class is going on a school trip to the mountains, and everyone is very excited! We’re leaving on Friday morning, and the bus departs at exactly 7:30 — so we all need to arrive early.",
      "Our teacher says the weather is going to be cold, so we’re going to need warm clothes. “I think it’ll probably snow,” she said, “so bring a good jacket.” Some students are going to bring their cameras to take photos of the mountains.",
      "I’m really looking forward to it. I’m going to try skiing for the first time, even though I’m a little nervous. My friend Anna says she’ll help me if I fall over! I’m sure we’re going to have an amazing time."
    ], items:[
      {type:"mc", q:"What time does the bus leave on Friday morning?", options:["7:00","7:30","8:30","9:15"], answer:1, why:"“the bus departs at exactly 7:30” – present simple cho lịch trình."},
      {type:"mc", q:"What does the teacher predict about the weather?", options:["It will be cold and it will probably snow","It will be hot and sunny","It will rain all day","It will be windy but dry"], answer:0, why:"Cô nói thời tiết sẽ lạnh và “I think it’ll probably snow”."},
      {type:"mc", q:"What are some students going to bring on the trip?", options:["Cameras","Skis","Food","Games"], answer:0, why:"“Some students are going to bring their cameras”."},
      {type:"mc", q:"What is the writer going to try for the first time?", options:["Skiing","Climbing","Camping","Snowboarding"], answer:0, why:"“I’m going to try skiing for the first time”."},
      {type:"open", q:"Have you ever been on a school trip? What are your plans for your next holiday or trip? (viết câu đầy đủ)"},
      {type:"open", q:"Tìm trong bài đọc: 1 câu present continuous (tương lai), 2 câu be going to, 2 câu will, 1 câu present simple (lịch trình). Chép lại các câu đó và giải thích vì sao dùng cấu trúc đó."}
    ]}
  ]
};
/* ===== HẾT PHẦN CHỈNH ===== */

const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g," ").trim().replace(/[.!?]+$/,"").trim();
const $=id=>document.getElementById(id);
const quiz=$("quiz");
$("title").textContent=QUIZ.title;$("sub").textContent=QUIZ.sub;document.title=QUIZ.title;
const ALL=[];QUIZ.sections.forEach(s=>s.items.forEach(it=>ALL.push(it)));
const graded=()=>ALL.map((it,i)=>[it,i]).filter(([it])=>it.type!=="open");

function build(){
  quiz.innerHTML="";let n=0;
  QUIZ.sections.forEach(sec=>{
    const h=document.createElement("h2");h.textContent=sec.title;quiz.appendChild(h);
    if(sec.note){const p=document.createElement("p");p.className="sub";p.textContent=sec.note;quiz.appendChild(p);}
    if(sec.passage){const b=document.createElement("div");b.className="card pass";sec.passage.forEach(t=>{const p=document.createElement("p");p.textContent=t;b.appendChild(p)});quiz.appendChild(b);}
    sec.items.forEach(it=>{
      const i=n++;it.idx=i;
      const c=document.createElement("div");c.className="card";c.id="c"+i;
      const q=document.createElement("p");q.className="q";q.textContent=(i+1)+". "+it.q;
      if(it.type==="open"){const t=document.createElement("span");t.className="tag";t.textContent=" (tự luận)";q.appendChild(t);}
      c.appendChild(q);
      if(it.type==="mc"){
        it.options.forEach((o,j)=>{
          const l=document.createElement("label");l.className="opt";
          const r=document.createElement("input");r.type="radio";r.name="q"+i;r.value=j;r.onchange=progress;
          const s=document.createElement("span");s.textContent=o;
          l.append(r,s);c.appendChild(l);
        });
      }else if(it.type==="gap"){
        const t=document.createElement("input");t.type="text";t.id="g"+i;t.autocomplete="off";t.autocapitalize="off";t.spellcheck=false;t.oninput=progress;c.appendChild(t);
      }else{
        const t=document.createElement("textarea");t.id="g"+i;t.rows=4;c.appendChild(t);
      }
      const fb=document.createElement("div");fb.className="fb";fb.id="f"+i;c.appendChild(fb);
      quiz.appendChild(c);
    });
  });
  progress();
}
function answered(i){
  const it=ALL[i];
  if(it.type==="mc")return !!document.querySelector('input[name="q'+i+'"]:checked');
  return $("g"+i).value.trim()!=="";
}
function progress(){
  const g=graded(),n=g.filter(([,i])=>answered(i)).length;
  $("prog").style.width=(100*n/g.length)+"%";
}
function grade(){
  let score=0;const g=graded();
  g.forEach(([it,i])=>{
    const c=$("c"+i),fb=$("f"+i);let ok=false,shown="";
    if(it.type==="mc"){
      const ch=document.querySelector('input[name="q'+i+'"]:checked');
      ok=!!ch&&+ch.value===it.answer;shown=it.options[it.answer];
      c.querySelectorAll(".opt").forEach((l,j)=>{
        l.classList.remove("right","wrong");
        if(j===it.answer)l.classList.add("right");else if(ch&&+ch.value===j)l.classList.add("wrong");
        l.querySelector("input").disabled=true;
      });
    }else{
      const t=$("g"+i);ok=it.answers.some(a=>norm(a)===norm(t.value));shown=it.answers[0];
      t.classList.remove("right","wrong");t.classList.add(ok?"right":"wrong");t.disabled=true;
    }
    if(ok)score++;
    fb.textContent=(ok?"✓ Đúng. ":"✗ Sai. Đáp án: "+shown+". ")+(it.why||"");
  });
  ALL.forEach((it,i)=>{if(it.type==="open"){$("g"+i).readOnly=true;$("f"+i).textContent="Giáo viên sẽ chấm phần này.";}});
  const total=g.length,name=$("name").value.trim()||"(chưa nhập tên)";
  $("scoreTxt").textContent="Điểm tự động: "+score+"/"+total+" ("+Math.round(100*score/total)/10+"/10)";
  let s=name+" – "+QUIZ.title+"\nĐiểm tự động: "+score+"/"+total+"\nNgày: "+new Date().toLocaleString("vi-VN");
  ALL.forEach((it,i)=>{if(it.type==="open"){const v=$("g"+i).value.trim();s+="\n\n["+(i+1)+"] "+(v||"(bỏ trống)");}});
  $("summary").value=s;
  $("result").style.display="block";$("reset").style.display="inline-block";$("submit").style.display="none";
  $("result").scrollIntoView({behavior:"smooth"});
}
$("submit").onclick=()=>{
  const left=graded().filter(([,i])=>!answered(i)).length;
  if(left&&!confirm("Còn "+left+" câu chưa làm. Vẫn nộp bài?"))return;
  grade();
};
$("reset").onclick=()=>{build();$("result").style.display="none";$("reset").style.display="none";$("submit").style.display="inline-block";window.scrollTo({top:0,behavior:"smooth"})};
build();
</script>
</body>
</html>
