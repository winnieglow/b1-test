<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buổi 8 – Review 2: Units 4, 5, 6</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#5d6678;--line:#dfe3ec;--accent:#2b6cb0;--ok:#1f8a4c;--okbg:#e4f5ea;--bad:#c0392b;--badbg:#fbe9e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--text:#e8ebf2;--muted:#9aa4b8;--line:#2e3545;--accent:#6aa7e8;--ok:#5fd18a;--okbg:#17321f;--bad:#ff8a7a;--badbg:#3a1d1a}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--text:#e8ebf2;--muted:#9aa4b8;--line:#2e3545;--accent:#6aa7e8;--ok:#5fd18a;--okbg:#17321f;--bad:#ff8a7a;--badbg:#3a1d1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.4rem;margin:0 0 4px}
h2{font-size:1.1rem;margin:22px 0 4px;color:var(--accent)}
.sub{color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.pass{border-left:4px solid var(--accent)}
.pass p{margin:0 0 8px}
.q{font-weight:600;margin:0 0 10px;line-height:2.1}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.opt input{margin-top:4px}
input[type=text],textarea{box-sizing:border-box;padding:8px 10px;font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.card>input[type=text],textarea{width:100%}
.q input[type=text]{width:9.5em;max-width:100%;margin:0 4px;font-weight:400}
button{font-size:1rem;padding:10px 18px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.right{border-color:var(--ok)!important;background:var(--okbg)}
.wrong{border-color:var(--bad)!important;background:var(--badbg)}
.fb{margin-top:8px;font-size:.92rem;color:var(--muted)}
.tag{font-size:.8rem;color:var(--muted);font-weight:400}
.score{font-size:1.6rem;font-weight:700}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 14px}
.bar div{height:100%;background:var(--accent);width:0}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<p class="sub" id="sub"></p>
<div class="card"><label for="name"><b>Họ và tên</b></label><input type="text" id="name" placeholder="Nguyễn Văn A" autocomplete="name" style="width:100%;margin-top:6px"></div>
<div class="bar"><div id="prog"></div></div>
<div id="quiz"></div>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<button id="submit">Nộp bài &amp; chấm điểm</button>
<button class="sec" id="reset" style="display:none">Làm lại</button>
</div>
<div class="card" id="result" style="display:none;margin-top:16px">
<div class="score" id="scoreTxt"></div>
<p class="sub">Phần tự luận giáo viên sẽ chấm riêng. Gửi nội dung bên dưới cho giáo viên (chụp màn hình hoặc sao chép).</p>
<textarea id="summary" rows="8" readonly></textarea>
</div>
</main>
<script>
/* ===== GIÁO VIÊN CHỈNH Ở ĐÂY =====
 mc: q, options[], answer (bắt đầu từ 0), why
 gap: q, answers[] (viết lại cả câu; liệt kê các đáp án chấp nhận), why
 multi: q có nhiều chỗ ___, answers[] là danh sách theo từng chỗ trống, mỗi chỗ là mảng các đáp án chấp nhận, why
 open: q (tự luận, không chấm tự động, gửi kèm bài cho giáo viên)
*/
const QUIZ = {
  title: "Buổi 8 – Review 2: Units 4, 5, 6",
  sub: "Ôn tập 4 thì hoàn thành (present perfect simple/continuous, past perfect simple/continuous) và từ vựng Unit 6. Bấm “Nộp bài” để xem điểm.",
  sections: [
    {title:"Kiểm tra ôn tập – Phần A: Dạng đúng của động từ", note:"Điền dạng đúng của động từ trong ngoặc (4 thì hoàn thành và past simple).", items:[
      {type:"multi", q:"By the time the exam started, I ___ (already/revise) all the topics.", answers:[["had already revised","'d already revised"]], why:"By the time + past simple: past perfect simple."},
      {type:"multi", q:"She ___ (learn) French for two years now, and she’s getting really good.", answers:[["has been learning","'s been learning","has learnt","'s learnt","has learned","'s learned"]], why:"for + khoảng thời gian, đến hiện tại: present perfect. Continuous nhấn mạnh quá trình học."},
      {type:"multi", q:"He looked exhausted because he ___ (study) all night before the test.", answers:[["had been studying","'d been studying"]], why:"all night, dừng ngay trước thời điểm quá khứ: past perfect continuous."},
      {type:"multi", q:"___ you ever ___ (fail) a driving test?", answers:[["have"],["failed"]], why:"Have you ever …? Trải nghiệm trong đời: present perfect simple."},
      {type:"multi", q:"We ___ (not/finish) the project when the teacher checked on us.", answers:[["hadn't finished","had not finished"]], why:"Chưa xong trước khi cô giáo đến kiểm tra: past perfect simple phủ định."},
      {type:"multi", q:"I ___ (achieve) my goal of passing the exam last month.", answers:[["achieved"]], why:"last month là mốc thời gian rõ ràng: past simple."},
      {type:"multi", q:"They ___ (wait) for the results for over a week now — still no news.", answers:[["have been waiting","'ve been waiting","have waited","'ve waited"]], why:"for + khoảng thời gian, vẫn đang tiếp diễn: present perfect (continuous nhấn mạnh quá trình)."},
      {type:"multi", q:"By 6 p.m. yesterday, she ___ (already/write) the whole report.", answers:[["had already written","'d already written"]], why:"By + mốc thời gian quá khứ: past perfect simple."}
    ]},
    {title:"Kiểm tra ôn tập – Phần B: Phrasal verb và từ vựng Unit 6", note:"Điền phrasal verb hoặc từ vựng Unit 6 phù hợp, chia đúng dạng nếu cần.", items:[
      {type:"multi", q:"If you don’t understand a word, ___ it ___ in a dictionary.", answers:[["look"],["up"]], why:"look up = tra cứu."},
      {type:"multi", q:"The teacher ___ ___ that we had made a mistake.", answers:[["pointed"],["out"]], why:"point out = chỉ ra (quá khứ: pointed out)."},
      {type:"multi", q:"Please ___ ___ the new vocabulary in your notebook.", answers:[["write"],["down"]], why:"write down = ghi lại."},
      {type:"multi", q:"I made a spelling mistake, so I had to ___ it ___.", answers:[["cross","rub"],["out"]], why:"cross out = gạch bỏ; rub out = tẩy xóa."},
      {type:"multi", q:"She’s very ___ maths — she never fails a test.", answers:[["talented at","good at"]], why:"talented at / good at + môn học."}
    ]},
    {title:"Kiểm tra ôn tập – Phần C: Viết lại câu", note:"Giữ nguyên nghĩa, dùng từ gợi ý (2–5 từ). Chỉ điền phần còn thiếu.", items:[
      {type:"multi", q:"I started learning Spanish three years ago and I still study it now. (BEEN) → I ___ Spanish for three years.", answers:[["have been learning","'ve been learning","have been studying","'ve been studying"]], why:"have been + V-ing + for three years."},
      {type:"multi", q:"She finished her homework before dinner started. (HAD) → She ___ before dinner started.", answers:[["had finished her homework","'d finished her homework","had done her homework","'d done her homework"]], why:"had + V3 cho việc xảy ra trước."},
      {type:"multi", q:"It’s the first time I have taken this exam. (NEVER) → I ___ this exam before.", answers:[["have never taken","'ve never taken"]], why:"have never + V3 = chưa bao giờ."}
    ]},
    {title:"Writing – Bài 1: Hoàn thành đoạn văn", note:"Chia đúng dạng động từ trong ngoặc (4 thì hoàn thành và past simple).", items:[
      {type:"multi", q:"Last week, I ___ (take) an important exam.", answers:[["took"]], why:"last week: past simple."},
      {type:"multi", q:"Before the exam, I ___ (revise) every night for two weeks, so by the time I sat down to write, I ___ (already/read) all my notes twice.", answers:[["had been revising","'d been revising","had revised","'d revised"],["had already read","'d already read"]], why:"Hành động xảy ra trước thời điểm quá khứ: past perfect (continuous nhấn mạnh quá trình ôn tập)."},
      {type:"multi", q:"I ___ (never/feel) so nervous before!", answers:[["had never felt","'d never felt","have never felt","'ve never felt"]], why:"Trải nghiệm trước thời điểm đó: had never felt (cũng chấp nhận have never felt)."},
      {type:"multi", q:"When I ___ (finish), I ___ (realise) that I ___ (be) sitting there for over three hours.", answers:[["finished"],["realised","realized"],["had been","'d been"]], why:"finished, realised (past simple); had been sitting (past perfect continuous) nhấn mạnh thời gian."},
      {type:"multi", q:"I ___ (just/get) my results — I passed!", answers:[["have just got","'ve just got","have just gotten","'ve just gotten","just got"]], why:"Vừa mới có kết quả, liên quan đến hiện tại: present perfect."}
    ]},
    {title:"Writing – Bài 2: Đoạn văn", note:"Phần này giáo viên chấm riêng.", items:[
      {type:"open", q:"Viết 8–10 câu về “A skill you have learned and how you achieved it”. Bắt buộc dùng: ít nhất 2 câu present perfect simple, 1 câu present perfect continuous, 2 câu past perfect simple, và ít nhất 3 từ vựng Unit 6."}
    ]},
    {title:"Reading – From Failure to Success", passage:[
      "Linh has always been talented at maths, but last year she failed an important exam. She had been studying for months, but on the day of the test, she felt too nervous to concentrate, and she made several careless mistakes.",
      "At first, she felt terrible. She had worked so hard, and it seemed like all her effort had been wasted. However, her teacher pointed out that failure is often part of learning. “You haven’t lost anything,” he said. “You’ve just found out what you need to work on.”",
      "Since that day, Linh has been practising every single day, and she has already retaken the exam — this time, she passed with one of the highest marks in her class. “I’ve learned that mistakes aren’t the end,” she says now. “They’re just the beginning of getting better.”"
    ], items:[
      {type:"mc", q:"What had Linh been doing before the exam, and what happened on the day of the test?", options:["She had been studying for months, but she felt too nervous to concentrate and made careless mistakes","She had been travelling, so she missed the exam","She had been teaching maths, and she passed easily","She had been ill, so she couldn’t take the exam"], answer:0, why:"“She had been studying for months … she felt too nervous to concentrate”."},
      {type:"mc", q:"How did Linh feel after failing the exam?", options:["Terrible, because she thought all her effort had been wasted","Happy, because she learned something","Angry with her teacher","Relaxed, because she didn’t care"], answer:0, why:"“At first, she felt terrible … all her effort had been wasted.”"},
      {type:"mc", q:"What did her teacher point out to her?", options:["That failure is often part of learning","That she should give up maths","That she needed a new degree","That the exam was too easy"], answer:0, why:"“her teacher pointed out that failure is often part of learning”."},
      {type:"mc", q:"What has Linh been doing since that day, and what was the result?", options:["Practising every day; she retook the exam and passed with one of the highest marks","Revising once a week; she failed again","Taking a course abroad; she got a degree","Teaching other students; she became a teacher"], answer:0, why:"“has been practising every single day … she passed with one of the highest marks”."},
      {type:"open", q:"Have you ever failed at something and then improved afterwards? Tell me about it. (viết câu đầy đủ)"},
      {type:"open", q:"Tìm trong bài đọc: 2 câu past perfect simple, 1 câu past perfect continuous, 2 câu present perfect simple, và 1 câu present perfect continuous. Viết lại các câu đó."}
    ]}
  ]
};
/* ===== HẾT PHẦN CHỈNH ===== */

const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g," ").trim().replace(/[.!?]+$/,"").trim();
const $=id=>document.getElementById(id);
const quiz=$("quiz");
$("title").textContent=QUIZ.title;$("sub").textContent=QUIZ.sub;document.title=QUIZ.title;
const ALL=[];QUIZ.sections.forEach(s=>s.items.forEach(it=>ALL.push(it)));
const graded=()=>ALL.map((it,i)=>[it,i]).filter(([it])=>it.type!=="open");
const blanks=i=>Array.from(document.querySelectorAll("#c"+i+" input[type=text]"));

function build(){
  quiz.innerHTML="";let n=0;
  QUIZ.sections.forEach(sec=>{
    const h=document.createElement("h2");h.textContent=sec.title;quiz.appendChild(h);
    if(sec.note){const p=document.createElement("p");p.className="sub";p.textContent=sec.note;quiz.appendChild(p);}
    if(sec.passage){const b=document.createElement("div");b.className="card pass";sec.passage.forEach(t=>{const p=document.createElement("p");p.textContent=t;b.appendChild(p)});quiz.appendChild(b);}
    sec.items.forEach(it=>{
      const i=n++;
      const c=document.createElement("div");c.className="card";c.id="c"+i;
      const q=document.createElement("p");q.className="q";
      if(it.type==="multi"){
        q.append((i+1)+". ");
        it.q.split("___").forEach((part,k,arr)=>{
          q.append(part);
          if(k<arr.length-1){const t=document.createElement("input");t.type="text";t.autocomplete="off";t.autocapitalize="off";t.spellcheck=false;t.oninput=progress;q.appendChild(t);}
        });
      }else{
        q.textContent=(i+1)+". "+it.q;
      }
      if(it.type==="open"){const t=document.createElement("span");t.className="tag";t.textContent=" (tự luận)";q.appendChild(t);}
      c.appendChild(q);
      if(it.type==="mc"){
        it.options.forEach((o,j)=>{
          const l=document.createElement("label");l.className="opt";
          const r=document.createElement("input");r.type="radio";r.name="q"+i;r.value=j;r.onchange=progress;
          const s=document.createElement("span");s.textContent=o;
          l.append(r,s);c.appendChild(l);
        });
      }else if(it.type==="gap"){
        const t=document.createElement("input");t.type="text";t.autocomplete="off";t.autocapitalize="off";t.spellcheck=false;t.oninput=progress;c.appendChild(t);
      }else if(it.type==="open"){
        const t=document.createElement("textarea");t.rows=4;c.appendChild(t);
      }
      const fb=document.createElement("div");fb.className="fb";fb.id="f"+i;c.appendChild(fb);
      quiz.appendChild(c);
    });
  });
  progress();
}
function answered(i){
  const it=ALL[i];
  if(it.type==="mc")return !!document.querySelector('input[name="q'+i+'"]:checked');
  return blanks(i).some(b=>b.value.trim()!=="");
}
function progress(){
  const g=graded(),n=g.filter(([,i])=>answered(i)).length;
  $("prog").style.width=(100*n/g.length)+"%";
}
function grade(){
  let score=0;
  graded().forEach(([it,i])=>{
    const c=$("c"+i),fb=$("f"+i);let ok=false,shown="";
    if(it.type==="mc"){
      const ch=document.querySelector('input[name="q'+i+'"]:checked');
      ok=!!ch&&+ch.value===it.answer;shown=it.options[it.answer];
      c.querySelectorAll(".opt").forEach((l,j)=>{
        l.classList.remove("right","wrong");
        if(j===it.answer)l.classList.add("right");else if(ch&&+ch.value===j)l.classList.add("wrong");
        l.querySelector("input").disabled=true;
      });
    }else if(it.type==="multi"){
      const bs=blanks(i);ok=true;
      bs.forEach((b,k)=>{
        const good=it.answers[k].some(a=>norm(a)===norm(b.value));
        b.classList.remove("right","wrong");b.classList.add(good?"right":"wrong");b.disabled=true;
        if(!good)ok=false;
      });
      shown=it.answers.map(a=>a[0]).join(" … ");
    }else{
      const t=blanks(i)[0];ok=it.answers.some(a=>norm(a)===norm(t.value));shown=it.answers[0];
      t.classList.remove("right","wrong");t.classList.add(ok?"right":"wrong");t.disabled=true;
    }
    if(ok)score++;
    fb.textContent=(ok?"✓ Đúng. ":"✗ Sai. Đáp án: "+shown+". ")+(it.why||"");
  });
  ALL.forEach((it,i)=>{if(it.type==="open"){document.querySelector("#c"+i+" textarea").readOnly=true;$("f"+i).textContent="Giáo viên sẽ chấm phần này.";}});
  const total=graded().length,name=$("name").value.trim()||"(chưa nhập tên)";
  $("scoreTxt").textContent="Điểm tự động: "+score+"/"+total+" ("+Math.round(100*score/total)/10+"/10)";
  let s=name+" – "+QUIZ.title+"\nĐiểm tự động: "+score+"/"+total+"\nNgày: "+new Date().toLocaleString("vi-VN");
  ALL.forEach((it,i)=>{if(it.type==="open"){const v=document.querySelector("#c"+i+" textarea").value.trim();s+="\n\n["+(i+1)+"] "+(v||"(bỏ trống)");}});
  $("summary").value=s;
  $("result").style.display="block";$("reset").style.display="inline-block";$("submit").style.display="none";
  $("result").scrollIntoView({behavior:"smooth"});
}
$("submit").onclick=()=>{
  const left=graded().filter(([,i])=>!answered(i)).length;
  if(left&&!confirm("Còn "+left+" câu chưa làm. Vẫn nộp bài?"))return;
  grade();
};
$("reset").onclick=()=>{build();$("result").style.display="none";$("reset").style.display="none";$("submit").style.display="inline-block";window.scrollTo({top:0,behavior:"smooth"})};
build();
</script>
</body>
</html>
